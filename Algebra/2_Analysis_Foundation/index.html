<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S6M5 - Part II - Analysis Foundation</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-surface: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-amber: #f59e0b;
            --neon-danger: #ef4444;
            --border-glow: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Lock master screen viewport scaling */
        }

        /* 🎴 CORE TWO-COLUMN EXPEDITION DASHBOARD LAYOUT */
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            width: 100vw;
        }

        /* 📡 LEFT NAVIGATION SIDEBAR NODE CORE */
        .sidebar {
            background-color: #0d1321;
            border-right: 1px solid var(--border-glow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 20px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Stats Widget Lane */
        .stats-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.8rem;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .stats-row:last-child { margin-bottom: 0; }
        .stats-label { color: var(--text-muted); }
        .stats-value { font-weight: bold; color: var(--neon-cyan); }

        /* Vertical Progression Map Path Track */
        .map-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            padding: 20px 0;
            position: relative;
        }
        .map-track::before {
            content: '';
            position: absolute;
            top: 40px; bottom: 40px; left: 50%;
            width: 2px;
            background: stroke-dasharray;
            border-left: 2px dashed #1e293b;
            transform: translateX(-50%);
            z-index: 1;
        }

        .map-node-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 2;
            cursor: pointer;
            width: 100%;
        }
        .map-node {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: all 0.3s;
            color: var(--text-muted);
        }
        .map-node-container.active .map-node {
            background: var(--neon-blue);
            color: #090d16;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(59,130,246,0.5);
        }
        .map-node-container.completed .map-node {
            background: #0f2d22;
            color: var(--neon-green);
            border-color: var(--neon-green);
        }
        .node-label { font-size: 0.75rem; font-weight: 600; text-align: center; }

        /* 🖥️ RIGHT CONTENT ACTIVE VIEWPORT PANEL */
        .content-pane {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-deep);
        }

        #viewport-root {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .content-iframe {
            width: 100%;
            height: 90vh;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            background: #111827;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .quiz-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--neon-amber);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .btn-action {
            background: var(--neon-blue); color: #090d16; border: none;
            padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.2s;
        }
        .btn-action:hover { background: var(--neon-cyan); }
        .btn-reset { background: transparent; border: 1px solid #334155; color: var(--neon-danger); font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 📡 LEFT COLUMN SIDEBAR CONTROL RADAR -->
        <div class="sidebar">
            <div class="header-title">
                <span>🎒 MAP INDEX</span>
                <button class="btn-reset" onclick="resetEngineState()">Reset</button>
            </div>

            <!-- Stats Matrix Tracking Widget -->
            <div class="stats-card">
                <div class="stats-row">
                    <span class="stats-label">Rewards Vector:</span>
                    <span class="stats-value" id="stat-xp">150 XP</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">Clear Progress:</span>
                    <span class="stats-value" id="stat-nodes">1/2</span>
                </div>
            </div>

            <!-- Vertical Linear Waypoint Route -->
            <div class="map-track" id="vertical-map-track">
                <!-- Nodes populate dynamically via JS -->
            </div>
        </div>

        <!-- 🖥️ RIGHT COLUMN ACTIVE LESSON VIEWPORT FRAME -->
        <div class="content-pane">
            <div id="viewport-root">
                <!-- Dynamic Iframe node target content inserts right here -->
            </div>
        </div>

    </div>
    <script>
        /* ─────────────────────────────────────────────────────────────────────────────
           CORE PROGRESS ENGINE ENGINE STATE CONFIGURATION
           ───────────────────────────────────────────────────────────────────────────── */
        const TOTAL_NODES = 11;
        
        let gameState = {
            highestUnlocked: 1,
            currentActiveLevel: 1,
            completedLevels: [],
            xp: 0
        };

        // Complete 11-Node Syllabus Route Titles
        const nodeTitles = {
            1: "1. Functions, Domain & Range",
            2: "2. Composite & Inverse Functions",
            3: "3. Symmetry, Parity & Polynomials",
            4: "4. Introduction to Limits",
            5: "5. Continuity Thresholds",
            6: "6. Derivatives from First Principles",
            7: "7. Power Rule Shortcuts",
            8: "8. Product & Quotient Rules",
            9: "9. The Chain Rule Protocol",
            10: "10. Tangents & Normals Equations",
            11: "11. Stationary Points Analysis"
        };

        function initProgressEngine() {
            const memory = localStorage.getItem("calculus_matrix_state");
            if (memory) {
                try {
                    gameState = JSON.parse(memory);
                } catch(e) {
                    console.error("State recovery corrupted, resetting defaults.");
                }
            }
            renderVerticalMapTrack();
            switchLevelView(gameState.currentActiveLevel);
        }

        function saveEngineState() {
            localStorage.setItem("calculus_matrix_state", JSON.stringify(gameState));
            syncSidebarInterface();
        }

        function resetEngineState() {
            if(confirm("Are you sure you want to clear your local dashboard memory checkpoint?")) {
                localStorage.removeItem("calculus_matrix_state");
                gameState = { highestUnlocked: 1, currentActiveLevel: 1, completedLevels: [], xp: 0 };
                saveEngineState();
                location.reload();
            }
        }

        /* 📡 VERTICAL NODE ARCHITECTURE MAP RENDERER */
        function renderVerticalMapTrack() {
            const trackContainer = document.getElementById("vertical-map-track");
            trackContainer.innerHTML = "";

            for (let i = 1; i <= TOTAL_NODES; i++) {
                const nodeWrapper = document.createElement("div");
                nodeWrapper.className = "map-node-container";
                
                if (i === gameState.currentActiveLevel) nodeWrapper.classList.add("active");
                if (gameState.completedLevels.includes(i)) nodeWrapper.classList.add("completed");
                
                // Block clicking locked nodes beyond the progression checkpoint
                if (i <= gameState.highestUnlocked) {
                    nodeWrapper.onclick = () => { switchLevelView(i); };
                } else {
                    nodeWrapper.style.opacity = "0.3";
                    nodeWrapper.style.cursor = "not-allowed";
                }

                nodeWrapper.innerHTML = `
                    <div class="map-node">${i}</div>
                    <div class="node-label">Module ${i}</div>
                `;
                trackContainer.appendChild(nodeWrapper);
            }
            syncSidebarInterface();
        }

        function syncSidebarInterface() {
            document.getElementById("stat-xp").textContent = gameState.completedLevels.length * 150 + " XP";
            document.getElementById("stat-nodes").textContent = gameState.completedLevels.length + " / " + TOTAL_NODES;
            
            // Re-sync active highlights across the tree structure nodes
            const containers = document.querySelectorAll(".map-node-container");
            containers.forEach((box, index) => {
                const levelNum = index + 1;
                box.classList.remove("active", "completed");
                if (levelNum === gameState.currentActiveLevel) box.classList.add("active");
                if (gameState.completedLevels.includes(levelNum)) box.classList.add("completed");
            });
        }

                /* 🖥️ LESSON VIEWPORT CORE DISPLAY ENGINE */
        function switchLevelView(levelId) {
            gameState.currentActiveLevel = levelId;
            saveEngineState();

            const viewport = document.getElementById("viewport-root");
            viewport.innerHTML = "";

            // Dynamic section loader block routing paths
            if (levelId === 1) {
                viewport.innerHTML = `
                    <iframe src="section1.html" class="content-iframe" style="height: 100%; border: none;"></iframe>
                `;
            } else if (levelId === 2) {
                viewport.innerHTML = `
                    <iframe src="section2.html" class="content-iframe" style="height: 100%; border: none;"></iframe>
                `;       
            } else if (levelId === 3) {
                viewport.innerHTML = `
                    <iframe src="section3.html" class="content-iframe" style="height: 100%; border: none;"></iframe>
                `;
            } else if (levelId === 4) {
                viewport.innerHTML = `
                    <iframe src="section4.html" class="content-iframe" style="height: 100%; border: none;"></iframe>
                `;
            } else if (levelId === 5) {
                viewport.innerHTML = `
                    <iframe src="section5.html" class="content-iframe" style="height: 100%; border: none;"></iframe>
                `;


            } else {
                viewport.innerHTML = `
                    <div style="background:#111827; border:1px solid var(--border-glow); padding:40px; border-radius:12px; text-align:center; width:100%; box-sizing:border-box;">
                        <h3 style="color:var(--neon-blue); margin-top:0;">📚 ${nodeTitles[levelId]}</h3>
                        <p style="color:var(--text-muted); max-width:400px; margin:15px auto;">This section template (section${levelId + 7}.html) is ready in the directory timeline framework shell.</p>
                    </div>
                `;
            }
        }

        /* 🔐 COMPOSITE CHECK COMPILATION VALIDATION */
        window.verifyCompositeKey = function() {
            // Find the active frame container first
            const iframe = document.querySelector('.content-iframe');
            if (!iframe) return;
            
            // Gain access to the internal document layer inside the frame
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Pull the elements directly from inside section1.html!
            const inputVal = iframeDoc.getElementById('composite-key-input').value.trim();
            const feedBox = iframeDoc.getElementById('quiz-feedback-box');
            
            // The secret composite workbook key string value checkpoint ('34')
            if (inputVal === "34") {
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Key Validated! Section 1 Complete. Section 2 Framework Unlocked.";
                
                if (!gameState.completedLevels.includes(1)) gameState.completedLevels.push(1);
                gameState.highestUnlocked = Math.max(gameState.highestUnlocked, 2);
                gameState.currentActiveLevel = 2;
                
                saveEngineState();
                renderVerticalMapTrack();
                setTimeout(() => { switchLevelView(2); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Invalid verification key. Check your workbook calculations and try again.";
            }
        };


        /* 🔐 SECTION 2 RATIO COMBINATION VALIDATION */
        window.verifySection2Key = function() {
            // Find the active frame container first
            const iframe = document.querySelector('.content-iframe');
            if (!iframe) return;
            
            // Gain access to the internal document layer inside the frame
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Pull the elements directly from inside section2.html!
            const inputVal = iframeDoc.getElementById('section2-key-input').value.trim();
            const feedBox = iframeDoc.getElementById('section2-feedback-box');
            
            // The secret composite verification passcode check
            if (inputVal === "510") { 
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Key Validated! Section 2 Complete. Section 3 Framework Unlocked.";
                
                if (!gameState.completedLevels.includes(2)) gameState.completedLevels.push(2);
                gameState.highestUnlocked = Math.max(gameState.highestUnlocked, 3);
                gameState.currentActiveLevel = 3;
                
                saveEngineState();
                renderVerticalMapTrack();
                setTimeout(() => { switchLevelView(3); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Invalid verification key. Check your simplified fractional terms and try again.";
            }
        };


        /* 🔐 SECTION 3 REMINDER TRACK VALIDATION */
        window.verifySection3Key = function() {
            // Find the active frame container first
            const iframe = document.querySelector('.content-iframe');
            if (!iframe) return;
            
            // Gain access to the internal document layer inside the frame
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Pull the elements directly from inside section3.html!
            const inputVal = iframeDoc.getElementById('section3-key-input').value.trim();
            const feedBox = iframeDoc.getElementById('section3-feedback-box');
            
            // The secret composite remainder passcode check
            if (inputVal === "04") { 
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Key Validated! Section 3 Complete. Section 4 Framework Unlocked.";
                
                if (!gameState.completedLevels.includes(3)) gameState.completedLevels.push(3);
                gameState.highestUnlocked = Math.max(gameState.highestUnlocked, 4);
                gameState.currentActiveLevel = 4;
                
                saveEngineState();
                renderVerticalMapTrack();
                setTimeout(() => { switchLevelView(4); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Invalid verification key. Check your polynomial remainder tracks and try again.";
            }
        };


        /* 🔐 SECTION 4 LIMITS VALIDATION CHECKPOINT */
        window.verifySection4Key = function() {
            // Find the active frame container first
            const iframe = document.querySelector('.content-iframe');
            if (!iframe) return;
            
            // Gain access to the internal document layer inside the frame
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Pull the elements directly from inside section4.html!
            const inputVal = iframeDoc.getElementById('section4-key-input').value.trim();
            const feedBox = iframeDoc.getElementById('section4-feedback-box');
            
            // The secret composite workbook constant code key ('52')
            if (inputVal === "52") {
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Key Validated! Section 4 Complete. Next Section Unlocked.";
                
                if (!gameState.completedLevels.includes(4)) gameState.completedLevels.push(4);
                gameState.highestUnlocked = Math.max(gameState.highestUnlocked, 5);
                gameState.currentActiveLevel = 5;
                
                saveEngineState();
                renderVerticalMapTrack();
                setTimeout(() => { switchLevelView(5); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Invalid verification key. Check your piecewise continuity algebra equations and try again.";
            }
        };

        /* 🔐 SECTION 5 DERIVATIVES VALIDATION CHECKPOINT */
        window.verifySection5Key = function() {
            // Find the active frame container and step into its document layer
            const iframe = document.querySelector('.content-iframe');
            if (!iframe) return;
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            const inputVal = iframeDoc.getElementById('section5-key-input').value.trim();
            const feedBox = iframeDoc.getElementById('section5-feedback-box');
            
            // The upcoming secret composite derivative calculation key placeholder
            if (inputVal === "5-16") { 
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Key Validated! Section 5 Complete. Section 6 Unlocked.";
                
                if (!gameState.completedLevels.includes(5)) gameState.completedLevels.push(5);
                gameState.highestUnlocked = Math.max(gameState.highestUnlocked, 6);
                gameState.currentActiveLevel = 6;
                
                saveEngineState();
                renderVerticalMapTrack();
                setTimeout(() => { switchLevelView(6); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Invalid verification key. Check your tangent slope point-intercept calculations and try again.";
            }
        };




        // Execute engine thread hooks immediately upon system mounting steps
        window.onload = initProgressEngine;
    </script>
</body>
</html>
