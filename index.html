<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Snippet Test</title>
    
    <!-- ⚡ Industry Standard Math Engine -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net" defer></script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body style="font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; line-height: 1.5;">

    <h2>🟢 Snippet Step 1: Math Text Test</h2>
    <p>We are checking if the browser reads the text and turns the signs between the dollar symbols into math notation.</p>

    <!-- Formula block display test -->
    <div style="background: #f1f5f9; padding: 15px; text-align: center; font-size: 1.25rem; border-radius: 6px; margin: 20px 0;">
        $$9x^2 + 24x + 7$$
    </div>

    <p>Inline test: Let $a = 9$, $b = 24$, and $c = 7$.</p>

    <!-- Micro-compiler snippet -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function runCompiler() {
                if (window.renderMathInElement) {
                    window.renderMathInElement(document.body, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError: false
                    });
                } else {
                    setTimeout(runCompiler, 50);
                }
            }
            runCompiler();
        });
    </script>
</body>
</html>
