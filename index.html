<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Sandbox</title>
    
    <!-- ⚡ Industry standard math presentation engine -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net" defer></script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #1e293b;">

    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <h2 style="margin-top: 0; color: #0f172a;">🧪 Sandbox Fresh Setup</h2>
        <p>Let's check if the math layout parses cleanly right here:</p>
        
        <!-- Display Math Block Test -->
        <div style="padding: 15px; background: #f1f5f9; border-radius: 8px; margin: 20px 0; text-align: center; font-size: 1.2rem;">
            $$ax^2 + bx + c = 0$$
        </div>

        <p>Inline test: The variable is $x$ and the constant is $c$.</p>
    </div>

    <!-- Lifecycle Engine: Scans the page the exact millisecond it finishes loading -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function renderMath() {
                if (window.renderMathInElement) {
                    window.renderMathInElement(document.body, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError: false
                    });
                } else {
                    setTimeout(renderMath, 50);
                }
            }
            renderMath();
        });
    </script>
</body>
</html>
