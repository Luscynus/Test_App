<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 4 Campaign Dashboard</title>
    <style>
        /* ─────────────────────────────────────────────────────────────────────────────
           PREMIUM NEON DARK THEME GRAPHICS ENGINE
           ───────────────────────────────────────────────────────────────────────────── */
        :root {
            --bg-deep: #090d16;
            --bg-surface: #0f172a;
            --border-glow: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-amber: #f59e0b;
            --neon-danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }

        .dashboard-wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }

        .progress-card {
            background: var(--bg-surface);
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        .bar-track {
            background: #1e293b;
            height: 12px;
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .bar-fill {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan));
            width: 25%;
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .map-canvas {
            background: radial-gradient(circle at 50% 50%, #111827 0%, var(--bg-deep) 100%);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 60px 40px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            min-height: 220px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .map-path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .quest-node {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
            cursor: pointer;
        }

        #node-1 { transform: translateY(20px); }
        #node-2 { transform: translateY(-30px); }

        .node-bubble {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #1e293b;
            border: 3px solid #475569;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .quest-node.unlocked .node-bubble {
            background: #06b6d4;
            border-color: #22d3ee;
            color: #090d16;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }

        .quest-node.completed .node-bubble {
            background: #10b981;
            border-color: #34d399;
            color: #090d16;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        .quest-node.locked { opacity: 0.5; cursor: not-allowed; }
        .node-title { margin-top: 12px; font-size: 0.9rem; font-weight: 600; text-align: center; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .node-meta { font-size: 0.75rem; color: var(--neon-cyan); margin-top: 2px; font-weight: bold; }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; letter-spacing: 0.05em; }

        .workspace-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .content-iframe {
            width: 100%;
            height: 520px;
            border: none;
            background: transparent;
            display: block;
        }

        .quiz-box {
            background: rgba(30,41,59,0.4);
            border: 1px dashed #334155;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .quiz-choice {
            display: block; width: 100%; text-align: left; background: #1e293b; border: 1px solid #334155;
            padding: 14px 18px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; color: var(--text-main);
            font-size: 1rem; transition: all 0.2s ease;
        }
        .quiz-choice:hover { background: #2d3748; border-color: var(--neon-blue); }
        .btn-action { background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan)); color: #090d16; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        
        <!-- Top Progress Header Panel Bar -->
        <div class="progress-card">
            <button style="float:right; padding: 5px 10px; font-size:0.8rem;" class="btn-action" onclick="resetCampaign()">Reset State</button>
            <strong style="font-size: 1.1rem; letter-spacing: 0.02em;">📈 ALGEBRA EXPEDITION — QUADRATIC MODELS</strong>
            <div class="bar-track"><div class="bar-fill" id="map-progress-bar"></div></div>
        </div>

        <!-- 🗺️ INTERACTIVE QUEST ROAD SINUSOID LAYER -->
        <div class="map-canvas">
            <svg class="map-path-svg">
                <path d="M 80 130 Q 230 10, 380 90 T 700 150" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8,8"/>
            </svg>

            <!-- Level 1 Node -->
            <div class="quest-node unlocked" id="node-1" onclick="switchLevelView(1)">
                <div class="node-bubble">1</div>
                <div class="node-title">Curriculum Module</div>
                <div class="node-meta">150 XP</div>
            </div>

            <!-- Level 2 Node -->
            <div class="quest-node locked" id="node-2" onclick="switchLevelView(2)">
                <div class="node-bubble">2</div>
                <div class="node-title">Practice Objective</div>
                <div class="node-meta">1200 XP</div>
            </div>
        </div>

        <!-- 📊 SYSTEM COUNTER FEEDBACK DISPLAY BLOCK -->
        <div class="stats-panel">
            <div>
                <div class="stat-value" id="stat-xp">150 XP</div>
                <div class="stat-label">Total Rewards Earned</div>
            </div>
            <div>
                <div class="stat-value" id="stat-unlocked">1 / 2</div>
                <div class="stat-label">Unlocked Waypoints</div>
            </div>
            <div>
                <div class="stat-value" id="stat-hours">Section 4</div>
                <div class="stat-label">Active Exploration Domain</div>
            </div>
        </div>

        <!-- Dynamic Content Viewing Port Box Sandbox Frame Container -->
        <div class="workspace-card" id="workspace-viewport"></div>

    </div>
        
    <!-- 🕹️ GAME STATE CONTROLLER COMPILER MODULE ENGINE -->
    <script>
        let gameState = {
            highestUnlocked: 1,
            completedLevels: [],
            isLockedOut: false,
            currentActiveLevel: 1
        };

        if (localStorage.getItem("quad_campaign_v5")) {
            gameState = JSON.parse(localStorage.getItem("quad_campaign_v5"));
        }

        document.addEventListener("DOMContentLoaded", function() {
            switchLevelView(gameState.currentActiveLevel);
        });

        function saveEngineState() {
            localStorage.setItem("quad_campaign_v5", JSON.stringify(gameState));
        }

        function syncUserInterface() {
            for (let i = 1; i <= 2; i++) {
                const node = document.getElementById('node-' + i);
                if (!node) continue;

                node.className = "quest-node";
                if (gameState.completedLevels.includes(i)) {
                    node.classList.add("completed");
                    node.querySelector(".node-bubble").textContent = "✓";
                } else if (i <= gameState.highestUnlocked && !gameState.isLockedOut) {
                    node.classList.add("unlocked");
                    node.querySelector(".node-bubble").textContent = i;
                } else {
                    node.classList.add("locked");
                    node.querySelector(".node-bubble").textContent = "🔒";
                }
            }

            let totalXp = gameState.completedLevels.includes(1) ? 1200 : 150;
            document.getElementById('stat-xp').textContent = totalXp + " XP";
            document.getElementById('stat-unlocked').textContent = (gameState.isLockedOut ? 0 : gameState.highestUnlocked) + " / 2";

            const barFill = document.getElementById('map-progress-bar');
            if (barFill) {
                let fillPct = gameState.completedLevels.includes(1) ? 100 : 50;
                if (gameState.isLockedOut) fillPct = 0;
                barFill.style.width = fillPct + "%";
            }
        }

        window.switchLevelView = function(levelId) {
            const viewport = document.getElementById('workspace-viewport');

            if (gameState.isLockedOut) {
                viewport.innerHTML = `
                    <h3 style="color:var(--neon-danger); margin-top:0;">🛑 Dashboard Terminal Freeze</h3>
                    <p style="font-size:1.15rem; font-weight:bold; background:rgba(239,68,68,0.1); border:1px solid var(--neon-danger); padding:15px; border-radius:8px; color:#fca5a5; text-align:center;">
                        See your teacher for an unlock code.
                    </p>
                `;
                return;
            }

            if (levelId > gameState.highestUnlocked) {
                viewport.innerHTML = `<h3 style="color:var(--text-muted); text-align:center; padding:40px 0;">🔒 Complete previous checkpoints to unlock this practice objective.</h3>`;
                return;
            }

            gameState.currentActiveLevel = levelId;
            saveEngineState();

            if (levelId === 1) {
                viewport.innerHTML = `
                    <iframe src="section4.html" class="content-iframe"></iframe>
                    
                    <div class="quiz-box">
                        <h4 style="margin-top:0; color:var(--neon-amber);">🏁 Gateway Validation Verification Check</h4>
                        <p>Complete this multiple-choice tracking node from your lesson text answers to clear the pathway layout coordinates:</p>
                        <p><strong>Question:</strong> What are the complete binomial grouping factors for your workbook example: <math><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>24</mn><mi>x</mi><mo>+</mo><mn>7</mn></math>?</p>
                        
                        <button class="quiz-choice" onclick="evaluateGatewayAnswer(0, false)">A) (9x + 1)(x + 7)</button>
                        <button class="quiz-choice" onclick="evaluateGatewayAnswer(1, true)">B) (3x + 1)(3x + 7)</button>
                        <button class="quiz-choice" onclick="evaluateGatewayAnswer(2, false)">C) (3x - 7)²</button>
                        <div id="quiz-feedback-box" style="margin-top:15px; font-weight:700;"></div>
                    </div>
                `;
            } else if (levelId === 2) {
                viewport.innerHTML = `
                    <h2 style="color: var(--neon-green); margin-top:0;">🏆 Waypoint Clear: Objectives Mastered</h2>
                    <p style="color: var(--text-muted);">You have successfully verified your proficiency metrics in non-monic factorization grouping matrices.</p>
                    <div style="background:#1e293b; border:1px solid #334155; padding:20px; border-radius:12px; margin-top:20px;">
                        <h3 style="color: var(--neon-cyan); margin-top:0;">📚 Active Project File Status Tracker</h3>
                        <p style="margin-bottom:0;">All external structures are responding cleanly. Continue completing worksheet templates inside your local notebook folders.</p>
                    </div>
                `;
            }
            syncUserInterface();
        };

        window.evaluateGatewayAnswer = function(chosenIndex, isCorrect) {
            const feedBox = document.getElementById('quiz-feedback-box');
            
            if (isCorrect) {
                feedBox.style.color = "var(--neon-green)";
                feedBox.textContent = "✓ Gatekeeper Verification Confirmed! Milestone Unlocked.";
                
                if (!gameState.completedLevels.includes(1)) gameState.completedLevels.push(1);
                gameState.highestUnlocked = 2;
                gameState.currentActiveLevel = 2;
                
                saveEngineState();
                setTimeout(() => { switchLevelView(2); }, 1500);
            } else {
                feedBox.style.color = "var(--neon-danger)";
                feedBox.textContent = "❌ Verification Failed.";
                
                gameState.isLockedOut = true;
                saveEngineState();
                setTimeout(() => { switchLevelView(1); }, 1200);
            }
        };

        window.resetCampaign = function() {
            gameState = { highestUnlocked: 1, completedLevels: [], isLockedOut: false, currentActiveLevel: 1 };
            saveEngineState();
            switchLevelView(1);
        };
    </script>
</body>
</html>
