<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Models Challenge Campaign</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 🧮 Clean MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']]
            }
        };
    </script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body>

    <!-- 🚨 Immediate Top-Level Window Error Radar -->
    <div id="critical-error-banner" style="display:none; margin:20px; padding:20px; background:#fee2e2; border:3px solid #ef4444; color:#b91c1c; font-family:monospace; border-radius:8px;">
        <h3 style="margin:0 0 10px 0;">⚠️ JavaScript Compilation Error:</h3>
        <p id="critical-error-text" style="margin:0; font-weight:bold;"></p>
    </div>
    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('critical-error-banner').style.display = 'block';
            document.getElementById('critical-error-text').innerText = msg + '\nLine: ' + line + '\nFile: ' + url;
            return false;
        };
    </script>

    <header>
        <h1>📐 Quadratic Models & Functions</h1>
        <p>Self-Paced Mastery Blueprint &bull; Campaign Board</p>
    </header>

    <div class="main-container">
        <div class="progress-container">
            <button class="reset-btn" id="reset-campaign-btn">Reset Progress</button>
            <strong>Your Campaign Completion Progress:</strong>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="global-progress"></div>
            </div>
        </div>

        <div class="campaign-map" id="map-target"></div>
    </div>

    <!-- 📦 The Content Loading Pipeline: Loads sections.html smoothly without security blocks -->
    <iframe src="s4.html" id="curriculum-loader" style="display: none;" onload="initAppEngine()"></iframe>
    <div id="curriculum-warehouse" style="display: none;"></div>

    <script src="app.js"></script>
</body>
</html>
