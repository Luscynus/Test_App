<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Offline MathML Test</title>
</head>
<body style="background-color: #ffffff; color: #000000; padding: 30px; font-family: sans-serif; line-height: 1.5; max-width: 600px; margin: 0 auto;">

    <h1 style="color: #2563eb;">🚀 Step 6: Native Browser MathML Test</h1>
    <p>This layout uses zero JavaScript and zero network connections. The browser compiles the symbols natively:</p>

    <!-- 🎯 Native Block Math Equation (No scripts or CDNs required!) -->
    <div style="background: #f1f5f9; padding: 25px; text-align: center; border-radius: 8px; margin: 20px 0; border: 1px solid #cbd5e1;">
        <math display="block" style="font-size: 1.8rem;">
            <mn>9</mn>
            <msup>
                <mi>x</mi>
                <mn>2</mn>
            </msup>
            <mo>+</mo>
            <mi>24</mi>
            <mi>x</mi>
            <mo>+</mo>
            <mn>7</mn>
            <mo>=</mo>
            <mn>0</mn>
        </math>
    </div>

    <!-- 🎯 Native Inline Math Equation -->
    <p>Inline formula test: Let 
        <math>
            <mi>a</mi>
            <mo>=</mo>
            <mn>9</mn>
        </math>, then the expression is active.
    </p>

    <div style="margin-top: 40px; padding: 10px; font-family: monospace; font-size: 0.85rem; border-top: 1px solid #e2e8f0; color: #16a34a; font-weight: bold;">
        ✅ Pipeline Status: 100% Offline Native Engine Engaged.
    </div>

</body>
</html>
