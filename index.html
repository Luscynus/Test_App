<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Models Challenge Campaign</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']]
            }
        };
    </script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body>

    <header>
        <h1>📐 Quadratic Models & Functions</h1>
        <p>Self-Paced Mastery Blueprint &bull; Campaign Board</p>
    </header>

    <div class="main-container">
        <div class="progress-container">
            <button class="reset-btn" id="reset-campaign-btn">Reset Progress</button>
            <strong>Your Campaign Completion Progress:</strong>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="global-progress"></div>
            </div>
        </div>

        <div class="campaign-map" id="map-target"></div>
    </div>

    <!-- Hidden parsing dock for asynchronous content -->
    <div id="curriculum-warehouse" style="display: none;"></div>

    <script src="app.js"></script>
</body>
</html>
