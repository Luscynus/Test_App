<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Models Challenge Campaign</title>
    
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- MathJax Configuration for professional equation typesetting -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <h1>📐 Quadratic Models & Functions</h1>
        <p>Self-Paced Mastery Blueprint &bull; Campaign Board</p>
    </header>

    <div class="main-container">
        
        <!-- Progress Tracking Panel -->
        <div class="progress-container">
            <button class="reset-btn" id="reset-campaign-btn">Reset Progress</button>
            <strong>Your Campaign Completion Progress:</strong>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="global-progress"></div>
            </div>
        </div>

        <!-- Dynamic Level Insertion Point -->
        <div class="campaign-map" id="map-target"></div>

    </div>

    <!-- Link to your external JavaScript framework engine -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
