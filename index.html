<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Quest Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .level-card {
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #3b82f6;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Calculus Unit Dashboard</h1>
        <p>Welcome, student! Work at your own pace through the modules below.</p>
        
        <div class="level-card">
            <h3>Level 1: The Power Rule (🟢 Unlocked)</h3>
            <p><strong>Must-Do:</strong> Complete Practice Set 1.1 in your notes.</p>
        </div>
    </div>
</body>
</html>
